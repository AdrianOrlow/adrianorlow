name: lint

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  lint:
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 'Lint markdown files'
        run: npx --yes markdownlint-cli@0.50.0 '**/*.md'

      - name: 'Check line endings'
        run: |
          crlf=$(git ls-files --eol | awk '$1 == "i/crlf" || $2 == "w/crlf" { print $NF }')
          if [ -n "$crlf" ]; then
            echo "::error::Files with CRLF line endings:"
            echo "$crlf"
            exit 1
          fi
